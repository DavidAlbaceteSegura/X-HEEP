#
# Steps shared by every job running in the x-heep-toolchain image: checkout,
# tools on PATH and Python environment.

steps:
- checkout: self
  fetchDepth: 1
  clean: true

# The image sets $RISCV_XHEEP and lists its tool directories in $TOOL_PATH, but
# only its login shell (env.sh) adds them to PATH
- script: |
    for dir in ${TOOL_PATH//:/ }; do echo "##vso[task.prependpath]$dir"; done
    git config --global --add safe.directory '*'
  displayName: Tools on PATH

- script: make venv REQUIREMENTS_TXT=util/python-requirements.txt
  displayName: Python environment
