#
# Steps shared by every job: checkout and Python environment.
# The agent must provide the RISC-V toolchain ($RISCV_XHEEP) and the simulator.

steps:
- checkout: self
  fetchDepth: 1

- script: make venv REQUIREMENTS_TXT=util/python-requirements.txt
  displayName: Python environment
