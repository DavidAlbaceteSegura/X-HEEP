#
# Steps shared by every job: checkout, tools image and Python environment.
#
# The tools image is far bigger than the free disk of a Microsoft-hosted
# agent, so it cannot be the job's container (pulled before any step): the
# job frees disk space first, then runs its commands in the image with
# ci/azure/in-image.sh.

parameters:
- name: inImage  # false: the job only needs Python, it runs on the agent
  type: boolean
  default: true

steps:
- checkout: self
  fetchDepth: 1
  clean: true

- ${{ if parameters.inImage }}:
  - script: |
      df -h / | tail -1
      sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      docker image prune -af > /dev/null
      df -h / | tail -1
    displayName: Free disk space for the tools image
  - script: docker pull -q $(XHEEP_IMAGE)
    displayName: Pull the tools image
  - script: ci/azure/in-image.sh 'make venv REQUIREMENTS_TXT=util/python-requirements.txt'
    displayName: Python environment

- ${{ else }}:
  - script: make venv REQUIREMENTS_TXT=util/python-requirements.txt
    displayName: Python environment
