#
# X-HEEP regression on Azure Pipelines, in three stages:
#
#   mcu-gen      mcu-gen, once                -> artifact mcu-gen (generated files)
#                test planning, in parallel   -> artifact test-plan (plan.json)
#   elaboration  elaboration, once            <- mcu-gen
#                                             -> artifact sim-build (elaborated model)
#   test run     one parallel job per planned test, each compiling its app
#                and then simulating it       <- all three artifacts
#
# No job repeats an earlier stage's work: each restores the generated files
# or the elaborated model it needs. Each test job publishes its junit.xml, so
# the run's Tests tab lists every test.
#
# Create the pipeline in Azure DevOps from this file (ci/azure/regression.yml).

trigger:
  branches:
    include: [main]

parameters:
- name: regression
  displayName: Regression file
  type: string
  default: ci/regressions/smoke.hjson
- name: tags
  displayName: Tags (a,b = a or b, a+b = a and b; empty = all)
  type: string
  default: ' '
- name: excludeTags
  displayName: Exclude tags
  type: string
  default: ' '
- name: pool
  displayName: Agent pool (needs the RISC-V toolchain and the simulator)
  type: string
  default: xheep-linux
- name: maxParallel
  displayName: Maximum parallel test jobs
  type: number
  default: 8

variables:
  OUT: $(Build.SourcesDirectory)/build/flow/ci

pool:
  name: ${{ parameters.pool }}

stages:

# -----------------------------------------------------------------------------
- stage: McuGen
  displayName: mcu-gen
  dependsOn: []
  jobs:
  - job: gen
    displayName: mcu-gen
    timeoutInMinutes: 30
    steps:
    - template: setup.yml
    - script: |
        . .venv/bin/activate
        python ci/run_flow.py ${{ parameters.regression }} --gen-only --out $(OUT)
      displayName: mcu-gen
    - publish: $(OUT)/build/mcu-gen.tar.gz
      artifact: mcu-gen
      displayName: Keep the generated files
    - publish: $(OUT)
      artifact: mcu-gen-logs
      displayName: mcu-gen logs
      condition: always()

  - job: plan
    displayName: test planning
    timeoutInMinutes: 10
    steps:
    - template: setup.yml
    - script: |
        . .venv/bin/activate
        set -- ${{ parameters.regression }} --plan $(Build.ArtifactStagingDirectory)/plan.json
        [ -n "$(echo '${{ parameters.tags }}' | xargs)" ] && set -- "$@" --tags '${{ parameters.tags }}'
        [ -n "$(echo '${{ parameters.excludeTags }}' | xargs)" ] && set -- "$@" --exclude-tags '${{ parameters.excludeTags }}'
        python ci/run_flow.py "$@"
      displayName: Select the tests
    - publish: $(Build.ArtifactStagingDirectory)/plan.json
      artifact: test-plan
      displayName: Keep the test plan

# -----------------------------------------------------------------------------
- stage: Elaboration
  displayName: elaboration
  dependsOn: [McuGen]
  jobs:
  - job: elaborate
    displayName: elaboration
    timeoutInMinutes: 120
    steps:
    - template: setup.yml
    - download: current
      artifact: mcu-gen
    - script: |
        . .venv/bin/activate
        python ci/run_flow.py ${{ parameters.regression }} --build-only \
          --use-gen $(Pipeline.Workspace)/mcu-gen/mcu-gen.tar.gz \
          --out $(OUT)
      displayName: Elaboration
    - publish: $(OUT)/build/sim-build.tar.gz
      artifact: sim-build
      displayName: Keep the elaborated model
    - publish: $(OUT)
      artifact: elaboration-logs
      displayName: Elaboration logs
      condition: always()

# -----------------------------------------------------------------------------
- stage: Test
  displayName: test run
  dependsOn: [McuGen, Elaboration]
  jobs:

  # Turns the kept plan into the matrix of the test jobs (a matrix can only
  # come from a job of the same stage)
  - job: load_plan
    displayName: load test plan
    timeoutInMinutes: 5
    steps:
    - checkout: none
    - download: current
      artifact: test-plan
    - script: |
        python3 - <<'EOF'
        import json
        plan = json.load(open("$(Pipeline.Workspace)/test-plan/plan.json"))
        print(f"{len(plan['tests'])} test(s): {', '.join(plan['matrix'])}")
        print("##vso[task.setvariable variable=matrix;isOutput=true]" + json.dumps(plan["matrix"]))
        EOF
      name: plan
      displayName: Matrix from the plan

  - job: test
    displayName: test
    dependsOn: load_plan
    timeoutInMinutes: 60
    strategy:
      matrix: $[ dependencies.load_plan.outputs['plan.matrix'] ]
      maxParallel: ${{ parameters.maxParallel }}
    steps:
    - template: setup.yml
    - download: current
      artifact: test-plan
    - download: current
      artifact: mcu-gen
    - download: current
      artifact: sim-build
    - script: |
        . .venv/bin/activate
        python ci/run_flow.py --from-plan $(Pipeline.Workspace)/test-plan/plan.json \
          --test $(TEST_NAME) --compile-only \
          --use-gen $(Pipeline.Workspace)/mcu-gen/mcu-gen.tar.gz \
          --out $(OUT)
      displayName: Compile $(TEST_NAME)
    - script: |
        . .venv/bin/activate
        python ci/run_flow.py --from-plan $(Pipeline.Workspace)/test-plan/plan.json \
          --test $(TEST_NAME) --sim-only \
          --use-build $(Pipeline.Workspace)/sim-build/sim-build.tar.gz \
          --out $(OUT)
      displayName: Simulate $(TEST_NAME)
    - task: PublishTestResults@2
      displayName: Test result
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: $(OUT)/junit.xml
        testRunTitle: $(TEST_NAME)
        failTaskOnFailedTests: false
    - publish: $(OUT)
      artifact: test-$(TEST_NAME)
      displayName: Test artifacts
      condition: always()
